<text x="145.0" y="194.8" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">Speaks, listens,</text>
<text x="145.0" y="213.3" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">presses a key</text>
<rect x="370" y="110" width="270" height="170" rx="14" fill="#2F80D1" stroke="#1C5FA3" stroke-width="1.5"/>
<text x="505.0" y="146.0" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Speech input</text>
<text x="505.0" y="170.0" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">[speakerphone + recognizers]</text>
<text x="505.0" y="200.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">1. Closed grammar: the fixed</text>
<text x="505.0" y="218.5" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">phrases; else open speech</text>
<text x="505.0" y="237.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">to text</text>
<rect x="760" y="110" width="290" height="190" rx="14" fill="#2F80D1" stroke="#1C5FA3" stroke-width="1.5"/>
<text x="905.0" y="146.0" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Command reader</text>
<text x="905.0" y="170.0" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">[tiers 2 and 3, gate]</text>
<text x="905.0" y="200.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">One menu action,</text>
<text x="905.0" y="218.5" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">or none</text>
<rect x="1120" y="110" width="270" height="190" rx="14" fill="#E8710A" stroke="#B35400" stroke-width="3"/>
<text x="1255.0" y="146.0" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Command model</text>
<text x="1255.0" y="170.0" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">[this model, llama.cpp server]</text>
<text x="1255.0" y="200.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">Returns one call,</text>
<text x="1255.0" y="218.5" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">or no call</text>
<rect x="370" y="470" width="270" height="170" rx="14" fill="#2F80D1" stroke="#1C5FA3" stroke-width="1.5"/>
<text x="505.0" y="506.0" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Keys</text>
<text x="505.0" y="530.0" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">[hardware]</text>
<text x="505.0" y="560.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">Confirm, cancel,</text>
<text x="505.0" y="578.5" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">leave</text>
<rect x="760" y="470" width="290" height="190" rx="14" fill="#2F80D1" stroke="#1C5FA3" stroke-width="1.5"/>
<text x="905.0" y="506.0" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Menu host</text>
<text x="905.0" y="530.0" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">[application]</text>
<text x="905.0" y="560.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">Holds the settings cards</text>
<text x="905.0" y="578.5" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">and their state; asks for</text>
<text x="905.0" y="597.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">confirmation</text>
<rect x="1120" y="470" width="270" height="170" rx="14" fill="#2F80D1" stroke="#1C5FA3" stroke-width="1.5"/>
<text x="1255.0" y="506.0" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Speech output</text>
<text x="1255.0" y="530.0" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">[text-to-speech]</text>
<text x="1255.0" y="560.0" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">Reads the cards and</text>
<text x="1255.0" y="578.5" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="middle">the result aloud</text>
