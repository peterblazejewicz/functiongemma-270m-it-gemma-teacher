<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="760" viewBox="0 0 1460 760" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, 'Yu Gothic UI', 'Noto Sans JP', sans-serif">
